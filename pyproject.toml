[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nanamigopher-agent"
version = "0.1.0"
description = "NanamiGopher AI Agent - Python backend"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "NanamiGopher Team", email = "team@nanamigopher.io" },
]
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain_ollama>=0.2.0",
    "langgraph>=0.2.0",
    "grpcio>=1.65.0",
    "grpcio-tools>=1.65.0",
    "protobuf>=5.0.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "structlog>=24.0.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "tenacity>=9.0.0",
    "rich>=13.0.0",
    "click>=8.0.0",
    "aiofiles>=24.0.0",
    "duckduckgo-search>=6.0.0",
    "markdownify>=0.11.0",
    "playwright>=1.48.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "black>=24.3.0",
    "pre-commit>=3.7.0",
]
vectorstores = [
    "chromadb>=0.5.0",
    "qdrant-client>=1.11.0",
]
sandbox = [
    "docker>=7.0.0",
]

[project.scripts]
nanami-agent = "agent.main:main_cli"

[tool.hatch.build.targets.wheel]
packages = ["python/agent"]

# ---- Ruff ----
[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

# ---- MyPy ----
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

# ---- Pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
