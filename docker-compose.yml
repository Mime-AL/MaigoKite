services:
  go-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: go-builder
    container_name: nanamigopher-go-api
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config:ro
      - data-volume:/app/data
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=sqlite:////app/data/memories.db
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
    depends_on:
      chromadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nanamigopher

  python-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: python-builder
    container_name: nanamigopher-python-agent
    ports:
      - "8081:8081"
    volumes:
      - ./config:/app/config:ro
      - data-volume:/app/data
    environment:
      - APP_ENV=${APP_ENV:-development}
      - GO_API_URL=http://go-api:8080
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
    depends_on:
      - go-api
      - chromadb
    restart: unless-stopped
    networks:
      - nanamigopher

  chromadb:
    image: chromadb/chroma:0.4.24
    container_name: nanamigopher-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - PERSIST_DIR=/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nanamigopher

  nginx:
    image: nginx:alpine
    container_name: nanamigopher-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/http.d/default.conf:ro
      - ./deploy/nginx-ssl.conf:/etc/nginx/http.d/ssl.conf:ro
      - ssl-certs:/etc/nginx/ssl:ro
    depends_on:
      - go-api
      - python-agent
    restart: unless-stopped
    networks:
      - nanamigopher

volumes:
  data-volume:
  chroma-data:
  ssl-certs:

networks:
  nanamigopher:
    driver: bridge
