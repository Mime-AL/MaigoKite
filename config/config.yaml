# MaigoKite Application Configuration

# App settings
app:
  name: "MaigoKite"
  version: "0.1.0"
  environment: "development"

# Model configuration
# NOTE: Actual model names and API Keys are configured by the user in the Settings page.
# Leave these blank/null — they serve as structural templates only.
models:
  chat:
    provider: ""
    default: ""
    base_url: ""
    temperature: 0.7
    max_tokens: 4096
    timeout_seconds: 60
  # Optional per-endpoint capacity fallbacks; see Configuration.md. Remote
  # routes without capacity metadata assume 262144, not the upstream's window.
  routes: []

# Empty = <installation directory>/.workspace, created on startup.
# Explicit paths override this default; MAIGOKITE_WORKSPACE_ROOT takes precedence.
workspace:
  root: ""

# Browser automation is started lazily. Set executable_path when using an
# existing system Chrome/Chromium instead of Playwright's managed browser.
browser:
  enabled: true
  headless: true
  executable_path: ""

# Tool visibility is independent of permission/approval. TODO and sleep are
# opt-in. Connected MCP tools are selected by each server's allow/deny lists.
tools:
  default_tools: [file_read, file_write, file_edit, glob, grep, exec_command, web_search, web_fetch, browser, skill]
  disabled_tools: []  # Startup ceiling; the settings UI cannot override this.

# Permission settings
permissions:
  default_mode: "workspace"
  # Empty arrays leave the corresponding dimension unrestricted. When set,
  # these allowlists further narrow (never broaden) the ToolPolicy boundary.
  allowlist:
    tools: []
    command_prefixes: []
    paths: []
  circuit_breaker:
    enabled: true
    blocked_patterns:
      - "rm -rf /"
      - "dd if="

storage:
  sqlite_path: "~/.maigokite/data/agent.db"

# Credential management
credentials:
  storage: "os_keychain"

# Skill scanning
skills:
  scan_directories:
    - "./skills/"
    - "~/.maigokite/skills/"

# Explicitly configured Phase 1 stdio MCP servers. Secret values stay outside
# YAML; env_allowlist only passes named variables from the parent environment.
mcp:
  servers: {}

# Observability
observability:
  console_output: true
