# MaigoKite Development Environment Configuration
# This file overrides config.yaml for development.

app:
  environment: "development"

models:
  chat:
    provider: ""
    default: ""
    base_url: ""
    temperature: 0.7
    max_tokens: 4096
    timeout_seconds: 60

storage:
  sqlite_path: "~/.maigokite/data/agent-dev.db"

workspace:
  root: "."

browser:
  enabled: true
  headless: true
  executable_path: "/usr/bin/google-chrome"

skills:
  scan_directories:
    - "./skills/"
    - "~/.maigokite/skills/"

tools:
  default_tools: [file_read, file_write, file_edit, glob, grep, exec_command, web_search, web_fetch, browser, skill]
  disabled_tools: []

permissions:
  default_mode: "workspace"
  allowlist:
    tools: []
    command_prefixes: []
    paths: []
  circuit_breaker:
    enabled: false

mcp:
  servers: {}

observability:
  console_output: true
