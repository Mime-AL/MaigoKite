# NanamiGopher Development Environment Configuration
# This file overrides config.yaml for development.

app:
  environment: "development"

models:
  prefer_local: true
  local_fallback_order:
    - ollama
    - lm_studio
    - vllm
  chat:
    provider: ""
    default: ""
    fallback: ""
    base_url: ""
    temperature: 0.7
    max_tokens: 4096
    timeout_seconds: 60
  embedding:
    provider: ""
    bge:
      model: ""
      device: "cpu"

workspace:
  root: "."

permissions:
  default_mode: "workspace"
  allowlist:
    tools: []
    command_prefixes: []
    paths: []
  circuit_breaker:
    enabled: false

mcp:
  servers: {}

observability:
  enabled: true
  console_output: true
  debug: true
  langfuse:
    enabled: false

inspector:
  save_history: true
  polling_interval_ms: 1000
