# NanamiGopher Production Environment Configuration
# This file overrides config.yaml for production.

app:
  environment: "production"

models:
  prefer_local: false
  # Production: model names are configured via Settings page or environment variables
  chat:
    provider: ""
    default: ""
    fallback: ""
    base_url: ""
    temperature: 0.7
    max_tokens: 4096
    timeout_seconds: 60
  embedding:
    provider: ""
    bge:
      model: ""
      device: "cuda"

workspace:
  root: "."

permissions:
  default_mode: "workspace"
  allowlist:
    tools: []
    command_prefixes: []
    paths: []
  circuit_breaker:
    enabled: true

mcp:
  servers: {}

observability:
  enabled: true
  console_output: true
  debug: false
  langfuse:
    enabled: true
    endpoint: "https://langfuse.nanamigopher.io"

inspector:
  save_history: true
  polling_interval_ms: 5000
