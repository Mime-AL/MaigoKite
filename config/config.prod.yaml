# NanamiGopher Production Environment Configuration
# This file overrides config.yaml for production.

app:
  environment: "production"

models:
  # Production: model names are configured via Settings page or environment variables
  chat:
    provider: ""
    default: ""
    base_url: ""
    temperature: 0.7
    max_tokens: 4096
    timeout_seconds: 60

storage:
  sqlite_path: "~/.nanamigopher/data/agent.db"

workspace:
  root: "."

browser:
  enabled: true
  headless: true
  executable_path: ""

skills:
  scan_directories:
    - "./skills/"
    - "~/.nanamigopher/skills/"

permissions:
  default_mode: "workspace"
  allowlist:
    tools: []
    command_prefixes: []
    paths: []
  circuit_breaker:
    enabled: true

mcp:
  servers: {}

observability:
  console_output: true
