syntax = "proto3";
package maigokite.agent.v1;
option go_package = "maigokite/gateway/pkg/proto/agent/v1;agentv1";

service AgentService {
  rpc ProcessMessage(ProcessMessageRequest) returns (stream AgentEvent);
  rpc CreateConversation(ConversationRequest) returns (Conversation);
  rpc GetConversation(ConversationRequest) returns (Conversation);
  rpc GetConversationSnapshot(ConversationRequest) returns (ConversationSnapshot);
  rpc ListConversations(ListConversationsRequest) returns (ConversationList);
  rpc DeleteConversation(ConversationRequest) returns (Empty);
  rpc UpdateConversationPermission(ConversationPermissionRequest) returns (Conversation);
  rpc UpdateConversationSettings(ConversationSettingsRequest) returns (Conversation);
  rpc ListWorkspaceFolders(WorkspaceRequest) returns (WorkspaceFolderList);
  rpc CreateWorkspaceFolder(WorkspaceFolderRequest) returns (WorkspaceFolder);
  rpc GetWorkspaceFolder(WorkspaceFolderRequest) returns (WorkspaceFolder);
  rpc ListMessages(ConversationRequest) returns (MessageList);
  rpc GetTask(TaskRequest) returns (Task);
  rpc ListTasks(TaskListRequest) returns (TaskList);
  rpc CancelTask(TaskRequest) returns (Task);
  rpc ListTaskEvents(TaskEventListRequest) returns (TaskEventList);
  rpc ListApprovals(ApprovalListRequest) returns (ApprovalList);
  rpc GetApproval(ApprovalRequest) returns (Approval);
  rpc GetTaskInspection(TaskRequest) returns (TaskInspection);
  rpc ListQuestions(ApprovalListRequest) returns (QuestionList);
  rpc AnswerQuestion(QuestionAnswerRequest) returns (stream AgentEvent);
  rpc SubmitTaskInput(TaskInputRequest) returns (TaskInput);
  rpc ListTaskInputs(TaskRequest) returns (TaskInputList);
  rpc ListJobs(TaskListRequest) returns (JobList);
  rpc StopJob(JobRequest) returns (Empty);
  rpc DecideApproval(ApprovalDecisionRequest) returns (stream AgentEvent);
  rpc CheckWorkspaceAccess(WorkspaceAccessRequest) returns (WorkspaceAccessResponse);
  rpc ListAuditEvents(ListConversationsRequest) returns (AuditEventList);
  rpc RecordAuditEvent(AuditWriteRequest) returns (Empty);
  rpc GetChatModelSettings(WorkspaceRequest) returns (ChatModelSettings);
  rpc UpdateChatModelSettings(UpdateChatModelSettingsRequest) returns (ChatModelSettings);
  rpc ListChatModels(WorkspaceRequest) returns (ChatModelList);
  rpc UpsertChatModel(UpsertChatModelRequest) returns (ChatModelSettings);
  rpc DeleteChatModel(ChatModelRequest) returns (Empty);
  rpc SetDefaultChatModel(ChatModelRequest) returns (ChatModelList);
  rpc ValidateChatModel(ValidateChatModelRequest) returns (ModelValidationResponse);
  rpc SetChatModelCredential(SetChatModelCredentialRequest) returns (Empty);
  rpc SetToolCredential(SetToolCredentialRequest) returns (Empty);
  rpc GetUserPreferences(UserPreferencesRequest) returns (UserPreferences);
  rpc UpdateUserPreferences(UpdateUserPreferencesRequest) returns (UserPreferences);
  rpc GetPermissionSettings(WorkspaceRequest) returns (PermissionSettings);
  rpc UpdatePermissionSettings(UpdatePermissionSettingsRequest) returns (PermissionSettings);
  rpc GetToolSettings(WorkspaceRequest) returns (ToolSettings);
  rpc UpdateToolSettings(UpdateToolSettingsRequest) returns (ToolSettings);
  rpc ListMemories(MemoryListRequest) returns (MemoryList);
  rpc UpsertMemory(UpsertMemoryRequest) returns (Memory);
  rpc DeleteMemory(MemoryRequest) returns (Empty);
  rpc GetWorkspaceDataSummary(WorkspaceRequest) returns (WorkspaceDataSummary);
  rpc ListMCPServers(WorkspaceRequest) returns (MCPServerList);
  rpc ListSkills(WorkspaceRequest) returns (SkillList);
  rpc GetExtensions(WorkspaceRequest) returns (ExtensionSettings);
  rpc UpdateExtensions(ExtensionUpdateRequest) returns (ExtensionSettings);
  rpc ReloadExtensions(ExtensionReloadRequest) returns (ExtensionSettings);
  rpc Health(Empty) returns (HealthResponse);
  rpc ResumeTask(ResumeTaskRequest) returns (stream AgentEvent);
}

message Empty {}
// JSON contains only the bounded product configuration/inspection DTO, never
// LangGraph types. Secret values travel only in the transient reload request.
message ExtensionSettings { string json = 1; }
message ExtensionUpdateRequest { string workspace_id = 1; string config_json = 2; }
message ExtensionReloadRequest {
  string workspace_id = 1;
  int64 revision = 2;
  string credentials_json = 3;
  // Reconnect only the last-applied configuration; never consume pending edits.
  bool restore_only = 4;
}
message Attachment { string type = 1; string path = 2; string url = 3; }
message ProcessMessageRequest {
  string workspace_id = 1;
  string conversation_id = 2;
  string content = 3;
  repeated Attachment attachments = 4;
  string principal_id = 5;
  reserved 6;
  string idempotency_key = 7;
}
message AgentEvent {
  string type = 1;
  string task_id = 2;
  string conversation_id = 3;
  string content = 4;
  string code = 5;
  string message = 6;
  bool retryable = 7;
  string payload_json = 8;
  string event_id = 9;
  int64 sequence = 10;
  string occurred_at = 11;
}
message ConversationRequest {
  string workspace_id = 1;
  string conversation_id = 2;
  string title = 3;
  string model_id = 4;
  string permission_mode = 5;
  string response_mode = 6;
  string folder_id = 7;
  optional int32 max_subagent_calls = 8;
  optional int32 max_concurrent_subagents = 9;
  repeated string subagent_model_ids = 10;
}
message ListConversationsRequest { string workspace_id = 1; }
message Conversation {
  string id = 1;
  string workspace_id = 2;
  string title = 3;
  string model_id = 4;
  string permission_mode = 5;
  string created_at = 6;
  string updated_at = 7;
  int32 message_count = 8;
  string response_mode = 9;
  string folder_id = 10;
  bool archived = 11;
  int32 max_subagent_calls = 12;
  int32 max_concurrent_subagents = 13;
  repeated string subagent_model_ids = 14;
}
message ConversationList { repeated Conversation conversations = 1; }
message ConversationSnapshot {
  repeated Message messages = 1;
  repeated Task tasks = 2;
  repeated Approval approvals = 3;
  repeated Question questions = 4;
  int64 last_sequence = 5;
  bool truncated = 6;
}
message ConversationPermissionRequest {
  string workspace_id = 1;
  string conversation_id = 2;
  string permission_mode = 3;
}
message ConversationSettingsRequest {
  string workspace_id = 1;
  string conversation_id = 2;
  optional string model_id = 3;
  optional string response_mode = 4;
  optional string permission_mode = 5;
  optional string title = 6;
  optional string folder_id = 7;
  optional bool archived = 8;
  optional int32 max_subagent_calls = 9;
  optional int32 max_concurrent_subagents = 10;
  // Message presence distinguishes an unchanged policy from an explicit empty list.
  ModelIdList subagent_models = 11;
}
message ModelIdList { repeated string model_ids = 1; }
message WorkspaceFolderRequest {
  string workspace_id = 1; string folder_id = 2; string root_path = 3; string name = 4;
}
message WorkspaceFolder {
  string id = 1; string name = 2; string root_path = 3;
}
message WorkspaceFolderList { repeated WorkspaceFolder folders = 1; }
message Message { string id = 1; string conversation_id = 2; string role = 3; string content = 4; string created_at = 5; }
message MessageList { repeated Message messages = 1; }
message TaskRequest { string workspace_id = 1; string task_id = 2; }
message TaskListRequest {
  string workspace_id = 1; string conversation_id = 2; int32 limit = 3;
}
message Task {
  string id = 1; string workspace_id = 2; string conversation_id = 3;
  string title = 4; string status = 5; string input_text = 6;
  string last_error = 7; int32 version = 8;
  string created_at = 9; string updated_at = 10;
  // Frozen routing permission for this turn; contains no credentials.
  repeated string subagent_model_ids = 11;
}
message TaskList { repeated Task tasks = 1; }
message TaskEventListRequest {
  string workspace_id = 1; string conversation_id = 2;
  int64 after_sequence = 3; int32 limit = 4;
}
message TaskEvent {
  string id = 1; string workspace_id = 2; string conversation_id = 3;
  string task_id = 4; int64 sequence = 5; string event_type = 6;
  string payload_json = 7; string occurred_at = 8;
}
message TaskEventList { repeated TaskEvent events = 1; }
message ApprovalListRequest { string workspace_id = 1; string conversation_id = 2; }
message ApprovalRequest { string workspace_id = 1; string approval_id = 2; }
message Approval {
  string id = 1; string workspace_id = 2; string conversation_id = 3;
  string task_id = 4; string tool_call_id = 5; string tool_name = 6;
  string arguments_json = 7; string resource_scope = 8; string risk_level = 9;
  string status = 10; int32 version = 11; string expires_at = 12;
  string note = 13; string decided_at = 14;
}
message ApprovalList { repeated Approval approvals = 1; }
message ApprovalDecisionRequest {
  string workspace_id = 1; string approval_id = 2; string principal_id = 3;
  string decision = 4; int32 version = 5; string note = 6;
}
message ToolCall {
  string id = 1; string task_id = 2; string tool_name = 3;
  string arguments_json = 4; string result_json = 5; string summary = 6;
  string status = 7; string risk_level = 8; string created_at = 9; string updated_at = 10;
}
// A read-only product projection; never contains checkpoints or continuation_json.
message TaskInspection {
  Task task = 1; repeated ToolCall tool_calls = 2; repeated Approval approvals = 3;
  string projection_json = 4; int64 last_sequence = 5;
}
message Question {
  string id = 1; string workspace_id = 2; string conversation_id = 3;
  string task_id = 4; string tool_call_id = 5; string title = 6;
  string options_json = 7; string status = 8; int32 version = 9;
  string answer = 10; string created_at = 11;
}
message QuestionList { repeated Question questions = 1; }
message QuestionAnswerRequest {
  string workspace_id = 1; string question_id = 2; string principal_id = 3;
  string answer = 4; int32 version = 5;
}
message TaskInputRequest {
  string workspace_id = 1; string task_id = 2; string content = 3; string idempotency_key = 4;
}
message TaskInput {
  string id = 1; string task_id = 2; string content = 3; string status = 4;
  string created_at = 5;
}
message TaskInputList { repeated TaskInput inputs = 1; }
message JobRequest { string workspace_id = 1; string job_id = 2; string principal_id = 3; }
message Job {
  string id = 1; string task_id = 2; string conversation_id = 3;
  string command = 4; string status = 5; string log_tail = 6;
  bool live = 7; bool live_logs_available = 8;
}
message JobList { repeated Job jobs = 1; }
message HealthResponse {
  string status = 1; string version = 2;
  map<string, bool> capabilities = 3;
}
message WorkspaceAccessRequest { string workspace_id = 1; string principal_id = 2; }
message WorkspaceAccessResponse { bool allowed = 1; string role = 2; }
message AuditEvent {
  string id = 1; string workspace_id = 2; string actor = 3; string action = 4;
  string resource = 5; string result = 6; string details_json = 7; string created_at = 8;
}
message AuditEventList { repeated AuditEvent events = 1; }
message AuditWriteRequest {
  string workspace_id = 1; string actor = 2; string action = 3;
  string resource = 4; string result = 5;
}
message WorkspaceRequest { string workspace_id = 1; }
message ChatModelSettings {
  string provider = 1;
  string model = 2;
  string base_url = 3;
  double temperature = 4;
  int32 max_tokens = 5;
  int32 timeout_seconds = 6;
  string id = 7;
  string name = 8;
  bool is_default = 9;
}
message UpdateChatModelSettingsRequest {
  string workspace_id = 1;
  ChatModelSettings settings = 2;
}
message ChatModelList {
  repeated ChatModelSettings models = 1;
  string default_model_id = 2;
}
message UpsertChatModelRequest {
  string workspace_id = 1;
  ChatModelSettings settings = 2;
}
message ChatModelRequest {
  string workspace_id = 1;
  string model_id = 2;
}
message ValidateChatModelRequest {
  ChatModelSettings settings = 1;
  string api_key = 2;
}
message ModelValidationResponse {
  bool ok = 1;
  string message = 2;
  string model = 3;
}
message SetChatModelCredentialRequest {
  string workspace_id = 1;
  string api_key = 2;
  string provider = 3;
  string model_id = 4;
}
message SetToolCredentialRequest {
  string workspace_id = 1;
  string service = 2;
  string api_key = 3;
}
message UserPreferencesRequest {
  string workspace_id = 1;
  string subject_user_id = 2;
}
message UserPreferences { string assistant_name = 1; }
message UpdateUserPreferencesRequest {
  string workspace_id = 1;
  string subject_user_id = 2;
  UserPreferences preferences = 3;
}
message PermissionSettings {
  string default_mode = 1;
  // Risk classification is internal tool metadata, not a user setting.
  reserved 2;
  reserved "tool_levels";
}
message UpdatePermissionSettingsRequest {
  string workspace_id = 1;
  PermissionSettings settings = 2;
}
message ToolSetting {
  string name = 1;
  string description = 2;
  string source = 3;
  bool enabled = 4;
  bool configurable = 5;
  bool default_enabled = 6;
}
message ToolSettings { repeated ToolSetting tools = 1; }
message UpdateToolSettingsRequest {
  string workspace_id = 1;
  map<string, bool> enabled = 2;
}
message MemoryListRequest {
  string workspace_id = 1;
  string subject_user_id = 2;
  string query = 3;
  int32 limit = 4;
}
message Memory {
  string id = 1;
  string workspace_id = 2;
  string subject_user_id = 3;
  string category = 4;
  string content = 5;
  string source_type = 6;
  string source_id = 7;
  double confidence = 8;
  string created_at = 9;
  string updated_at = 10;
}
message MemoryList { repeated Memory memories = 1; }
message UpsertMemoryRequest {
  string workspace_id = 1;
  string subject_user_id = 2;
  Memory memory = 3;
}
message MemoryRequest {
  string workspace_id = 1;
  string subject_user_id = 2;
  string memory_id = 3;
}
message WorkspaceDataSummary {
  string storage_backend = 1;
  int64 conversation_count = 2;
  int64 message_count = 3;
  int64 memory_count = 4;
  int64 task_count = 5;
  int64 audit_event_count = 6;
}
message MCPServer {
  string namespace = 1;
  string status = 2;
  string transport = 3;
  repeated string tool_names = 4;
}
message MCPServerList { repeated MCPServer servers = 1; }
message Skill {
  string name = 1; string version = 2; string description = 3;
  string kind = 4; string source_path = 5; string parameters_schema_json = 6;
}
message SkillList { repeated Skill skills = 1; }
message ResumeTaskRequest {
  string workspace_id = 1; string task_id = 2;
  string principal_id = 3; int32 version = 4;
}
